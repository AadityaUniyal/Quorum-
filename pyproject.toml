[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel-ai"
version = "1.0.0"
description = "Privacy-Aware Multi-Tenant Document Intelligence and Workflow Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DocIntel AI Team", email = "team@docintel.ai"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "zxcvbn>=4.4.28",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "authlib>=1.3.0",
    "slowapi>=0.1.9",
    "cryptography>=42.0.0",
    "pika>=1.3.2",
    "aio-pika>=9.4.0",
    "redis>=5.0.3",
    "chromadb>=0.4.24",
    "httpx>=0.27.0",
    "google-generativeai>=0.3.0",
    "google-genai>=0.1.1",
    "tenacity>=8.2.0",
    "aiohttp>=3.9.0",
    "sentence-transformers>=2.7.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "boto3>=1.34.0",
    "minio>=7.2.0",
    "sentry-sdk>=1.40.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.23.0",
    "prometheus-client>=0.20.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "hypothesis>=6.100.0",
    "faker>=24.0.0"
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pip-tools>=7.4.0",
    "locust>=2.24.0"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/googi-crawler/tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "-v --tb=short --strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", ".venv", "node_modules"]
