# Ruff configuration for DocIntel AI
# https://docs.astral.sh/ruff/

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "T20",  # flake8-print
]
ignore = [
    "S101",   # Allow assert in tests
    "S105",   # Allow hardcoded passwords (for defaults in config)
    "S106",   # Allow hardcoded password args
    "S110",   # Allow try-except-pass in non-critical blocks
    "S314",   # Allow xml ElementTree
    "S324",   # Allow non-crypto md5 hashing for cache keys
    "B008",   # Allow function calls in argument defaults (FastAPI Depends)
    "B904",   # Allow raising exceptions without explicit from clause in FastAPI handlers
    "E402",   # Module level import not at top of file
    "E501",   # Line too long (handled by formatter)
    "E741",   # Ambiguous variable name in list comprehensions
    "W293",   # Blank line contains whitespace
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "T20"]
"alembic/*" = ["F401", "I001"]

[format]
quote-style = "double"
indent-style = "space"
