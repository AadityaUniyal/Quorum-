services:
  - type: web
    name: quorum-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PREFERRED_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: LLM_OFFLINE_MOCK_FALLBACK
        value: "false"
