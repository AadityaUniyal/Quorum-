[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "googi-crawler"
version = "0.1.0"
description = "Standalone web crawler package for GOOGI platform"
authors = [{name = "Aaditya Uniyal", email = "aaditya@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=9.0",
    "redis>=5.0"
]

[project.urls]
Homepage = "https://github.com/AadityaUniyal/Googi"
