name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.OWNER_LC }}/googi-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/googi-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/googi-backend:cache,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.OWNER_LC }}/googi-worker:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/googi-worker:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/googi-worker:cache,mode=max
