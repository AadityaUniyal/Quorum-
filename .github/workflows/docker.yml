name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    # Run on PRs as well to ensure build passes
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/googi-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/googi-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/googi-backend:cache,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/googi-worker:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/googi-worker:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/googi-worker:cache,mode=max
