apiVersion: apps/v1
kind: Deployment
metadata:
  name: googi-backend
  namespace: googi-dev
  labels:
    app: googi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googi-backend
  template:
    metadata:
      labels:
        app: googi-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/yourorg/googi-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: googi-config
            - secretRef:
                name: googi-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      restartPolicy: Always
