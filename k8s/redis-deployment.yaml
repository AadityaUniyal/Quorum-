apiVersion: apps/v1
kind: Deployment
metadata:
  name: googi-redis
  namespace: googi-dev
  labels:
    app: googi-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: googi-redis
  template:
    metadata:
      labels:
        app: googi-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: googi-secret
                  key: REDIS_PASSWORD
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
      restartPolicy: Always
