apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
  namespace: docintel
  labels:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/part-of: docintel-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
      app.kubernetes.io/component: vector-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
        app.kubernetes.io/component: vector-store
        app.kubernetes.io/part-of: docintel-platform
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:0.4.24
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      restartPolicy: Always
