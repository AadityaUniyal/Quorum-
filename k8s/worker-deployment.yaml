apiVersion: apps/v1
kind: Deployment
metadata:
  name: googi-worker
  namespace: googi-dev
  labels:
    app: googi-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googi-worker
  template:
    metadata:
      labels:
        app: googi-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/yourorg/googi-worker:latest
          envFrom:
            - configMapRef:
                name: googi-config
            - secretRef:
                name: googi-secret
          command: ["celery", "-A", "app.workers", "worker", "--loglevel=info"]
      restartPolicy: Always
