apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: docintel
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: queue-worker
    app.kubernetes.io/part-of: docintel-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/component: queue-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: queue-worker
        app.kubernetes.io/part-of: docintel-platform
    spec:
      containers:
        - name: worker
          image: ghcr.io/aadityauniyal/docintel-worker:latest
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: docintel-config
            - secretRef:
                name: docintel-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
      restartPolicy: Always
