# ============================================================================
# GOOGI Platform - Kubernetes Secrets
# ============================================================================
# IMPORTANT: Replace ALL placeholder values with your actual secrets.
#
# SECURITY NOTES:
#   - NEVER commit real secrets to version control
#   - Use a secrets manager (Vault, AWS Secrets Manager, etc.) in production
#   - Consider using SealedSecrets or External Secrets Operator for GitOps
#   - This file is a TEMPLATE only - copy to secret.local.yaml and customize
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: googi-secret
  namespace: googi
  labels:
    app: googi
    app.kubernetes.io/name: googi-secret
    app.kubernetes.io/part-of: googi-platform
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgresql://username:password@host:port/database
  DATABASE_URL: "postgresql://user:password@postgres:5432/googi_db"
  
  # Redis password (leave empty if authentication is disabled)
  REDIS_PASSWORD: ""
  
  # RabbitMQ credentials for task queue
  RABBITMQ_USER: "guest"
  RABBITMQ_PASS: "guest"
  
  # JWT signing key - MUST be changed for production (use a strong random string)
  # Generate with: openssl rand -hex 32
  JWT_SECRET: "your_secret_key_here"
  
  # LLM API key (Google Gemini, OpenAI, etc.)
  LLM_API_KEY: "your_api_key_here"
  
  # LLM model identifier (e.g., gemini-1.5-pro, gpt-4, etc.)
  LLM_MODEL: "gemini-1.5-pro"
