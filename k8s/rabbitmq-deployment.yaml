apiVersion: apps/v1
kind: Deployment
metadata:
  name: googi-rabbitmq
  namespace: googi-dev
  labels:
    app: googi-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: googi-rabbitmq
  template:
    metadata:
      labels:
        app: googi-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: googi-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: googi-secret
                  key: RABBITMQ_PASS
          # Management UI accessible via port 15672
      restartPolicy: Always
